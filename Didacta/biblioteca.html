<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIDACTA — Biblioteca de Artillería 105mm & 155mm</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    overflow-x: hidden;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0a1628;
    color: #e0f0ff;
    user-select: none;
  }

  canvas#ocean {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 0;
  }

  .layer {
    position: relative;
    z-index: 10;
  }

  /* ── HEADER ── */
  .header {
    text-align: center;
    padding: 28px 0 12px;
  }
  .header h1 {
    font-size: 2rem;
    font-weight: 700;
    text-shadow: 0 0 24px rgba(100, 200, 255, 0.5);
    letter-spacing: 3px;
  }
  .header h1 span { color: #ff4444; }
  .header p {
    color: rgba(150, 210, 255, 0.5);
    font-size: 0.8rem;
    margin-top: 4px;
    letter-spacing: 1px;
  }

  /* ── TABS ── */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin: 16px 0 8px;
  }
  .tab {
    padding: 10px 28px;
    border-radius: 8px 8px 0 0;
    background: rgba(15, 35, 65, 0.5);
    border: 1px solid rgba(80, 160, 255, 0.15);
    border-bottom: none;
    color: rgba(140, 200, 255, 0.6);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 1px;
  }
  .tab:hover { background: rgba(20, 50, 90, 0.6); color: #c0e0ff; }
  .tab.active {
    background: rgba(20, 50, 90, 0.8);
    border-color: rgba(80, 160, 255, 0.4);
    color: #e0f0ff;
    box-shadow: 0 -2px 20px rgba(60, 150, 255, 0.1);
  }

  /* ── SECTION ── */
  .section { display: none; padding: 16px 0; }
  .section.active { display: block; }

  /* ── CAROUSEL ── */
  .carousel-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 480px;
    perspective: 1200px;
  }
  .carousel {
    position: relative;
    width: 320px; height: 420px;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
  }

  /* ── PDF CARD ── */
  .card {
    position: absolute;
    width: 280px; height: 380px;
    left: 50%; top: 50%;
    margin-left: -140px; margin-top: -190px;
    border-radius: 16px;
    background: linear-gradient(145deg, rgba(15, 35, 65, 0.92), rgba(8, 20, 45, 0.95));
    border: 1px solid rgba(80, 160, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 60px rgba(50,130,220,0.08),
                inset 0 1px 0 rgba(120,200,255,0.1);
    backdrop-filter: blur(12px);
    padding: 20px;
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer;
    transition: box-shadow 0.4s, border-color 0.4s;
    backface-visibility: hidden;
  }
  .card:hover {
    border-color: rgba(100, 200, 255, 0.5);
    box-shadow: 0 12px 48px rgba(0,0,0,0.6), 0 0 80px rgba(60,150,255,0.15);
  }
  .card .icon {
    width: 80px; height: 100px; margin: 16px 0;
    background: linear-gradient(135deg, #1a3a5c, #0d2240);
    border-radius: 8px;
    border: 1px solid rgba(80, 160, 255, 0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem;
    position: relative; overflow: hidden;
  }
  .card .icon::after {
    content: '';
    position: absolute; top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(45deg, transparent 40%, rgba(100,200,255,0.06) 50%, transparent 60%);
    animation: iconShine 4s ease-in-out infinite;
  }
  @keyframes iconShine {
    0%,100% { transform: translateX(-100%) rotate(45deg); }
    50% { transform: translateX(100%) rotate(45deg); }
  }
  .card .title {
    color: #c0e0ff; font-size: 0.85rem; font-weight: 600;
    text-align: center; margin: 12px 0 6px; line-height: 1.3;
  }
  .card .desc {
    color: rgba(150,195,240,0.6); font-size: 0.72rem;
    text-align: center; line-height: 1.4; flex: 1;
  }
  .card .badge {
    margin-top: auto;
    padding: 6px 16px; border-radius: 20px;
    background: linear-gradient(135deg, rgba(40,120,200,0.3), rgba(30,90,170,0.2));
    border: 1px solid rgba(80,160,255,0.25);
    color: rgba(140,200,255,0.8);
    font-size: 0.68rem; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase;
    transition: all 0.3s;
  }
  .card:hover .badge {
    background: linear-gradient(135deg, rgba(50,140,230,0.5), rgba(40,110,200,0.4));
    color: #e0f0ff; box-shadow: 0 0 20px rgba(60,150,255,0.2);
  }

  /* ── IMAGE CARD ── */
  .img-card {
    position: absolute;
    width: 300px; height: 380px;
    left: 50%; top: 50%;
    margin-left: -150px; margin-top: -190px;
    border-radius: 16px;
    background: rgba(8, 18, 38, 0.95);
    border: 1px solid rgba(80, 160, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 60px rgba(50,130,220,0.08);
    overflow: hidden;
    cursor: pointer;
    transition: box-shadow 0.4s, border-color 0.4s, transform 0.3s;
    backface-visibility: hidden;
  }
  .img-card:hover {
    border-color: rgba(100, 200, 255, 0.5);
    box-shadow: 0 12px 48px rgba(0,0,0,0.6), 0 0 80px rgba(60,150,255,0.15);
  }
  .img-card img {
    width: 100%; height: 280px;
    object-fit: contain;
    background: rgba(5, 12, 25, 0.8);
    padding: 8px;
  }
  .img-card .img-info {
    padding: 12px 16px;
  }
  .img-card .img-title {
    color: #c0e0ff; font-size: 0.8rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .img-card .img-tag {
    display: inline-block; margin-top: 6px;
    padding: 3px 10px; border-radius: 12px;
    background: rgba(40, 120, 200, 0.2);
    border: 1px solid rgba(80, 160, 255, 0.2);
    color: rgba(140, 200, 255, 0.7);
    font-size: 0.65rem; font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* ── NAV ── */
  .nav-btn {
    z-index: 20;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(15, 35, 65, 0.7);
    border: 1px solid rgba(80, 160, 255, 0.25);
    color: rgba(140, 200, 255, 0.8);
    font-size: 1.4rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    margin: 0 24px;
    transition: all 0.3s;
    backdrop-filter: blur(8px);
  }
  .nav-btn:hover {
    background: rgba(30, 70, 130, 0.6);
    border-color: rgba(100, 200, 255, 0.5);
    color: #e0f0ff;
    box-shadow: 0 0 30px rgba(60, 150, 255, 0.2);
    transform: scale(1.08);
  }

  /* ── DOTS ── */
  .dots {
    display: flex; justify-content: center;
    gap: 8px; padding: 8px 0 16px;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: rgba(80, 160, 255, 0.2);
    border: 1px solid rgba(80, 160, 255, 0.3);
    cursor: pointer; transition: all 0.3s;
  }
  .dot.active {
    background: rgba(80, 180, 255, 0.7);
    box-shadow: 0 0 12px rgba(80, 180, 255, 0.5);
    transform: scale(1.3);
  }

  /* ── COUNTER ── */
  .counter {
    text-align: center;
    color: rgba(140, 200, 255, 0.5);
    font-size: 0.75rem;
    letter-spacing: 1px;
    padding-bottom: 12px;
  }

  /* ── 3D INSPECTOR MODAL ── */
  .inspector-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(2, 8, 18, 0.95);
    z-index: 1000;
    align-items: center; justify-content: center;
    flex-direction: column;
  }
  .inspector-overlay.open { display: flex; }

  .inspector-container {
    position: relative;
    width: 80vw; height: 75vh;
    perspective: 1500px;
    display: flex; align-items: center; justify-content: center;
  }
  .inspector-img {
    max-width: 90%; max-height: 90%;
    object-fit: contain;
    border-radius: 12px;
    border: 1px solid rgba(80, 160, 255, 0.3);
    box-shadow: 0 0 80px rgba(40, 120, 220, 0.15);
    transition: transform 0.1s ease-out;
    cursor: grab;
  }
  .inspector-img:active { cursor: grabbing; }

  .inspector-controls {
    display: flex; gap: 12px; margin-top: 20px;
  }
  .inspector-btn {
    padding: 10px 24px; border-radius: 8px;
    background: rgba(15, 35, 65, 0.8);
    border: 1px solid rgba(80, 160, 255, 0.3);
    color: rgba(140, 200, 255, 0.8);
    font-size: 0.85rem; cursor: pointer;
    transition: all 0.3s;
  }
  .inspector-btn:hover {
    background: rgba(30, 70, 130, 0.6);
    border-color: rgba(100, 200, 255, 0.5);
    color: #e0f0ff;
  }
  .inspector-title {
    color: rgba(150, 210, 255, 0.7);
    font-size: 0.85rem;
    margin-top: 12px;
    letter-spacing: 1px;
  }

  /* ── SPLASH ── */
  .wave-splash {
    position: fixed; pointer-events: none; z-index: 5;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(100,220,255,0.3), transparent 70%);
    animation: splash 1.2s ease-out forwards;
  }
  @keyframes splash {
    0% { transform: scale(0); opacity: 1; }
    100% { transform: scale(3); opacity: 0; }
  }
</style>
</head>
<body>

<canvas id="ocean"></canvas>

<div class="layer">
  <div class="header">
    <h1>⚔ <span>DIDACTA</span> — BIBLIOTECA DE ARTILLERÍA</h1>
    <p>Obús 105mm & 155mm — Manuales Técnicos • Componentes • Referencia Visual</p>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="pdfs">📘 MANUALES</div>
    <div class="tab" data-tab="imgs">🎯 COMPONENTES</div>
  </div>

  <!-- PDF Section -->
  <div class="section active" id="sec-pdfs">
    <div class="carousel-wrap">
      <button class="nav-btn" data-dir="-1" data-target="pdfs">◀</button>
      <div class="carousel" id="carousel-pdfs"></div>
      <button class="nav-btn" data-dir="1" data-target="pdfs">▶</button>
    </div>
    <div class="dots" id="dots-pdfs"></div>
    <div class="counter" id="counter-pdfs"></div>
  </div>

  <!-- Images Section -->
  <div class="section" id="sec-imgs">
    <div class="carousel-wrap">
      <button class="nav-btn" data-dir="-1" data-target="imgs">◀</button>
      <div class="carousel" id="carousel-imgs" style="width:340px;"></div>
      <button class="nav-btn" data-dir="1" data-target="imgs">▶</button>
    </div>
    <div class="dots" id="dots-imgs"></div>
    <div class="counter" id="counter-imgs"></div>
  </div>
</div>

<!-- 3D Inspector -->
<div class="inspector-overlay" id="inspector">
  <div class="inspector-container" id="inspector-container">
    <img class="inspector-img" id="inspector-img" src="" alt="">
  </div>
  <div class="inspector-title" id="inspector-title"></div>
  <div class="inspector-controls">
    <button class="inspector-btn" onclick="inspectorZoom(1.2)">🔍 Zoom +</button>
    <button class="inspector-btn" onclick="inspectorZoom(0.8)">🔍 Zoom −</button>
    <button class="inspector-btn" onclick="inspectorReset()">↺ Reset</button>
    <button class="inspector-btn" onclick="closeInspector()">✕ Cerrar</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════
// DATA — PDFs from both Didacta/pdf and backend
// ══════════════════════════════════════════

const PDF_ICONS = ['📘','📗','📕','📙','🔍','💥','⚙','🎯','📖','📋','📓','📒','📔','🗂','📑'];

let pdfData = [];
let imgData = [];

async function loadData() {
  try {
    const [pdfRes, imgRes] = await Promise.all([
      fetch('http://127.0.0.1:8001/api/biblioteca/pdfs').then(r => r.json()).catch(() => null),
      fetch('http://127.0.0.1:8001/api/biblioteca/imagenes').then(r => r.json()).catch(() => null),
    ]);

    if (pdfRes && pdfRes.pdfs) {
      pdfData = pdfRes.pdfs.map((p, i) => ({
        file: p.ruta,
        title: p.nombre.replace(/-/g, ' ').replace(/_/g, ' '),
        desc: `${p.origen.toUpperCase()} — ${p.tamano_mb} MB`,
        icon: PDF_ICONS[i % PDF_ICONS.length],
      }));
    }

    if (imgRes && imgRes.imagenes) {
      imgData = imgRes.imagenes;
    }
  } catch(e) {
    console.warn('Backend no disponible, cargando datos locales');
  }

  // Fallback: scan local pdfs
  if (pdfData.length === 0) {
    pdfData = [
      { file: 'pdf/TM-43-0001-28-1994.pdf', title: 'TM 43-0001-28 (1994)', desc: 'Data Sheets — Munición de Artillería', icon: '📘' },
      { file: 'pdf/TM-43-0001-28-1977.pdf', title: 'TM 43-0001-28 (1977)', desc: 'Data Sheets — Edición clásica', icon: '📗' },
      { file: 'pdf/TM-9-1300-203-1967.pdf', title: 'TM 9-1300-203 (1967)', desc: 'Artillery Ammunition', icon: '📕' },
      { file: 'pdf/TM-9-1300-203-1960.pdf', title: 'TM 9-1300-203 (1960)', desc: 'Artillery Ammunition — Edición anterior', icon: '📙' },
      { file: 'pdf/TM-9-1904.pdf', title: 'TM 9-1904', desc: 'Ammunition Inspection Guide', icon: '🔍' },
      { file: 'pdf/TM-9-1300-214-1984.pdf', title: 'TM 9-1300-214 (1984)', desc: 'Military Explosives', icon: '💥' },
      { file: 'pdf/TM-9-1385-51.pdf', title: 'TM 9-1385-51', desc: 'Fuzes — Espoletas de artillería', icon: '⚙' },
      { file: 'pdf/USNBD-Army-Projectiles-1943.pdf', title: 'USNBD Projectiles (1943)', desc: 'Proyectiles del Ejército', icon: '🎯' },
      { file: 'pdf/ordnance-and-munitions.pdf', title: 'Ordnance & Munitions', desc: 'Referencia general', icon: '📖' },
      { file: 'pdf/MIL-STD-444.pdf', title: 'MIL-STD-444', desc: 'Estándar de nomenclatura', icon: '📋' },
    ];
  }

  buildPdfCarousel();
  buildImgCarousel();
}

// ══════════════════════════════════════════
// CAROUSEL ENGINE (reusable)
// ══════════════════════════════════════════

const carousels = {};

function createCarouselEngine(id, buildCard) {
  const el = document.getElementById(`carousel-${id}`);
  const dotsEl = document.getElementById(`dots-${id}`);
  const counterEl = document.getElementById(`counter-${id}`);
  const engine = { current: 0, total: 0, el, dotsEl, counterEl };
  carousels[id] = engine;
  return engine;
}

function updateCarousel(id) {
  const eng = carousels[id];
  const cards = eng.el.children;
  const dots = eng.dotsEl.children;

  for (let i = 0; i < cards.length; i++) {
    const offset = i - eng.current;
    const absOff = Math.abs(offset);
    const z = 100 - absOff * 30;
    const x = offset * 220;
    const rotY = -offset * 35;
    const scale = Math.max(0.6, 1 - absOff * 0.15);
    const opacity = Math.max(0, 1 - absOff * 0.3);

    cards[i].style.transform = `translateX(${x}px) translateZ(${z}px) rotateY(${rotY}deg) scale(${scale})`;
    cards[i].style.opacity = opacity;
    cards[i].style.zIndex = 100 - absOff;
    cards[i].style.pointerEvents = absOff <= 1 ? 'auto' : 'none';
  }

  for (let i = 0; i < dots.length; i++) {
    dots[i].classList.toggle('active', i === eng.current);
  }

  eng.counterEl.textContent = `${eng.current + 1} / ${eng.total}`;
  triggerSplash(eng);
}

function goTo(id, idx) {
  const eng = carousels[id];
  eng.current = Math.max(0, Math.min(eng.total - 1, idx));
  updateCarousel(id);
}

// ══════════════════════════════════════════
// PDF CAROUSEL
// ══════════════════════════════════════════

function buildPdfCarousel() {
  const eng = createCarouselEngine('pdfs');
  eng.total = pdfData.length;

  pdfData.forEach((pdf, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="icon">${pdf.icon}</div>
      <div class="title">${pdf.title}</div>
      <div class="desc">${pdf.desc}</div>
      <div class="badge">Abrir Manual</div>
    `;
    card.addEventListener('click', () => window.open(pdf.file, '_blank'));
    eng.el.appendChild(card);

    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.addEventListener('click', () => goTo('pdfs', i));
    eng.dotsEl.appendChild(dot);
  });

  updateCarousel('pdfs');
}

// ══════════════════════════════════════════
// IMAGE CAROUSEL + 3D INSPECTOR
// ══════════════════════════════════════════

function buildImgCarousel() {
  const eng = createCarouselEngine('imgs');

  // If backend provided images, use those; else scan local
  let images = imgData.length > 0
    ? imgData.map(img => ({ src: `http://127.0.0.1:8001${img.ruta}`, name: img.nombre }))
    : [];

  // If no backend, try local fallback — load from known referenced images
  if (images.length === 0) {
    // Will be populated by backend when available
    images = [{ src: 'images/clip0001.png', name: 'Sin conexión al servidor' }];
  }

  eng.total = images.length;

  images.forEach((img, i) => {
    const card = document.createElement('div');
    card.className = 'img-card';

    const calibre = img.name.match(/155/) ? '155mm' : img.name.match(/105/) ? '105mm' : 'REF';

    card.innerHTML = `
      <img src="${img.src}" alt="${img.name}" loading="lazy"
           onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22><rect fill=%22%230d1f3c%22 width=%22200%22 height=%22200%22/><text fill=%22%23446688%22 x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2214%22>Sin imagen</text></svg>'">
      <div class="img-info">
        <div class="img-title">${img.name}</div>
        <span class="img-tag">${calibre}</span>
        <span class="img-tag" style="margin-left:4px">🔍 INSPECCIONAR</span>
      </div>
    `;
    card.addEventListener('click', () => openInspector(img.src, img.name));
    eng.el.appendChild(card);

    // Only show dots for first 30 to avoid overflow
    if (i < 30 || images.length <= 30) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.addEventListener('click', () => goTo('imgs', i));
      eng.dotsEl.appendChild(dot);
    }
  });

  updateCarousel('imgs');
}

// ── 3D INSPECTOR ──
let inspScale = 1, inspRotX = 0, inspRotY = 0;
let isDragging = false, lastX = 0, lastY = 0;

function openInspector(src, name) {
  const overlay = document.getElementById('inspector');
  const img = document.getElementById('inspector-img');
  const title = document.getElementById('inspector-title');
  img.src = src;
  title.textContent = name;
  inspectorReset();
  overlay.classList.add('open');
}

function closeInspector() {
  document.getElementById('inspector').classList.remove('open');
}

function inspectorZoom(factor) {
  inspScale = Math.max(0.3, Math.min(5, inspScale * factor));
  applyInspectorTransform();
}

function inspectorReset() {
  inspScale = 1; inspRotX = 0; inspRotY = 0;
  applyInspectorTransform();
}

function applyInspectorTransform() {
  const img = document.getElementById('inspector-img');
  img.style.transform = `scale(${inspScale}) rotateX(${inspRotX}deg) rotateY(${inspRotY}deg)`;
}

document.getElementById('inspector-container').addEventListener('mousedown', (e) => {
  isDragging = true; lastX = e.clientX; lastY = e.clientY;
  e.preventDefault();
});
document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  inspRotY += dx * 0.3;
  inspRotX -= dy * 0.3;
  inspRotX = Math.max(-80, Math.min(80, inspRotX));
  lastX = e.clientX; lastY = e.clientY;
  applyInspectorTransform();
});
document.addEventListener('mouseup', () => { isDragging = false; });

document.getElementById('inspector').addEventListener('wheel', (e) => {
  e.preventDefault();
  inspectorZoom(e.deltaY < 0 ? 1.1 : 0.9);
}, { passive: false });

// ESC to close
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeInspector();
});

// ══════════════════════════════════════════
// TABS
// ══════════════════════════════════════════

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(`sec-${tab.dataset.tab}`).classList.add('active');
  });
});

// ══════════════════════════════════════════
// NAVIGATION (arrows, keys, wheel, touch)
// ══════════════════════════════════════════

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const id = btn.dataset.target;
    const dir = parseInt(btn.dataset.dir);
    goTo(id, carousels[id].current + dir);
  });
});

function activeTab() {
  return document.querySelector('.tab.active').dataset.tab;
}

document.addEventListener('keydown', (e) => {
  if (document.getElementById('inspector').classList.contains('open')) return;
  const id = activeTab();
  if (e.key === 'ArrowLeft') goTo(id, carousels[id].current - 1);
  if (e.key === 'ArrowRight') goTo(id, carousels[id].current + 1);
});

let wheelThrottle = false;
document.addEventListener('wheel', (e) => {
  if (document.getElementById('inspector').classList.contains('open')) return;
  e.preventDefault();
  if (wheelThrottle) return;
  wheelThrottle = true;
  const id = activeTab();
  goTo(id, carousels[id].current + (e.deltaY > 0 ? 1 : -1));
  setTimeout(() => wheelThrottle = false, 200);
}, { passive: false });

let touchStartX = 0;
document.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
document.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) {
    const id = activeTab();
    goTo(id, carousels[id].current + (dx < 0 ? 1 : -1));
  }
});

// ══════════════════════════════════════════
// WAVE SPLASH
// ══════════════════════════════════════════

function triggerSplash(eng) {
  const cards = eng.el.children;
  if (!cards[eng.current]) return;
  const rect = cards[eng.current].getBoundingClientRect();
  if (Math.random() > 0.5) {
    const splash = document.createElement('div');
    splash.className = 'wave-splash';
    const side = Math.random() > 0.5 ? rect.left - 10 : rect.right - 10;
    splash.style.left = side + 'px';
    splash.style.top = (rect.top + Math.random() * rect.height) + 'px';
    splash.style.width = '40px'; splash.style.height = '40px';
    document.body.appendChild(splash);
    setTimeout(() => splash.remove(), 1200);
  }
}

// ══════════════════════════════════════════
// OCEAN + PLANKTON + WAVES (same engine)
// ══════════════════════════════════════════

const canvas = document.getElementById('ocean');
const ctx = canvas.getContext('2d');
let W, H;

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const plankton = [];
for (let i = 0; i < 120; i++) {
  plankton.push({
    x: Math.random()*2000, y: Math.random()*2000,
    r: Math.random()*2.5+0.5, vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.3,
    pulse: Math.random()*Math.PI*2, pulseSpeed: 0.01+Math.random()*0.03,
    hue: 180+Math.random()*40, brightness: 0.3+Math.random()*0.7,
  });
}

const waves = [
  { amp:25, freq:0.008, speed:0.015, y:0.55, color:'rgba(15,50,100,0.4)' },
  { amp:18, freq:0.012, speed:0.022, y:0.60, color:'rgba(10,40,85,0.5)' },
  { amp:30, freq:0.006, speed:0.010, y:0.65, color:'rgba(8,30,70,0.6)' },
  { amp:15, freq:0.015, speed:0.028, y:0.70, color:'rgba(5,25,60,0.7)' },
  { amp:22, freq:0.010, speed:0.018, y:0.75, color:'rgba(3,18,50,0.8)' },
];

const splashParticles = [];
let time = 0;

function getCardRects() {
  const id = activeTab();
  const eng = carousels[id];
  if (!eng) return [];
  const rects = [];
  const cards = eng.el.children;
  for (let i = 0; i < cards.length; i++) {
    if (Math.abs(i - eng.current) <= 2) rects.push(cards[i].getBoundingClientRect());
  }
  return rects;
}

function animate() {
  time++;
  ctx.clearRect(0,0,W,H);

  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0a1628'); grad.addColorStop(0.3,'#0c1e3a');
  grad.addColorStop(0.6,'#0a2a4a'); grad.addColorStop(1,'#051525');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  // Light rays
  ctx.save(); ctx.globalAlpha = 0.03;
  for (let i=0;i<5;i++) {
    const rx = W*0.2+i*W*0.15;
    const rg = ctx.createLinearGradient(rx,0,rx+80,H*0.7);
    rg.addColorStop(0,'rgba(100,200,255,0.8)'); rg.addColorStop(1,'transparent');
    ctx.fillStyle = rg; ctx.beginPath();
    ctx.moveTo(rx-20,0);
    ctx.lineTo(rx+40+Math.sin(time*0.005+i)*20,H*0.7);
    ctx.lineTo(rx-60+Math.sin(time*0.005+i)*20,H*0.7);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  const cardRects = getCardRects();

  waves.forEach(wave => {
    ctx.beginPath();
    const baseY = H * wave.y;
    ctx.moveTo(0,H);
    for (let x=0;x<=W;x+=3) {
      let wy = baseY + Math.sin(x*wave.freq+time*wave.speed)*wave.amp
                      + Math.sin(x*wave.freq*1.5+time*wave.speed*0.7)*wave.amp*0.3;
      cardRects.forEach(rect => {
        const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
        const dx = x-cx, dy = wy-cy;
        const dist = Math.sqrt(dx*dx+dy*dy);
        const influence = rect.width*0.8;
        if (dist < influence) {
          wy -= (1-dist/influence)*25*Math.sign(dy||1);
          if (dist < influence*0.4 && Math.random()>0.97) {
            splashParticles.push({
              x, y:wy, vx:(Math.random()-0.5)*3, vy:-Math.random()*4-1,
              life:1, r:Math.random()*3+1, hue:190+Math.random()*30
            });
          }
        }
      });
      ctx.lineTo(x,wy);
    }
    ctx.lineTo(W,H); ctx.closePath();
    ctx.fillStyle = wave.color; ctx.fill();
  });

  plankton.forEach(p => {
    p.x += p.vx + Math.sin(time*0.01+p.pulse)*0.2;
    p.y += p.vy + Math.cos(time*0.008+p.pulse)*0.15;
    p.pulse += p.pulseSpeed;
    if(p.x<-10) p.x=W+10; if(p.x>W+10) p.x=-10;
    if(p.y<-10) p.y=H+10; if(p.y>H+10) p.y=-10;
    p.x += Math.sin(p.x*0.01+time*0.015)*0.3;
    const glow = (Math.sin(p.pulse)+1)/2;
    const alpha = 0.15+glow*p.brightness*0.6;
    const radius = p.r*(0.8+glow*0.4);
    ctx.save();
    ctx.globalAlpha = alpha*0.3; ctx.beginPath();
    ctx.arc(p.x,p.y,radius*4,0,Math.PI*2);
    ctx.fillStyle = `hsla(${p.hue},80%,70%,0.3)`; ctx.fill();
    ctx.globalAlpha = alpha; ctx.beginPath();
    ctx.arc(p.x,p.y,radius,0,Math.PI*2);
    ctx.fillStyle = `hsla(${p.hue},90%,80%,1)`; ctx.fill();
    ctx.restore();
  });

  for (let i=splashParticles.length-1;i>=0;i--) {
    const sp = splashParticles[i];
    sp.x+=sp.vx; sp.y+=sp.vy; sp.vy+=0.1; sp.life-=0.02;
    if(sp.life<=0) { splashParticles.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha=sp.life*0.7;
    ctx.beginPath(); ctx.arc(sp.x,sp.y,sp.r,0,Math.PI*2);
    ctx.fillStyle=`hsla(${sp.hue},80%,75%,1)`; ctx.fill();
    ctx.globalAlpha=sp.life*0.3; ctx.beginPath();
    ctx.arc(sp.x,sp.y,sp.r*3,0,Math.PI*2);
    ctx.fillStyle=`hsla(${sp.hue},80%,70%,0.4)`; ctx.fill();
    ctx.restore();
  }

  requestAnimationFrame(animate);
}

animate();
loadData();
</script>
</body>
